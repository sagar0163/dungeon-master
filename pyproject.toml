[project]
name = "dungeon-master"
version = "0.1.0"
description = "AI-powered Dungeon Master for tabletop RPGs"
authors = [{ name = "Sagar Jadhav", email = "sagarjadhav063@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C90", "B"]
ignore = ["E501", "C901", "F821", "E722", "B904", "B007", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"