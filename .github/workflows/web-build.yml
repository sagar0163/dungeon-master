name: Build & Deploy (export-all)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap toolchain (godot/.NET/templates)
        run: make setup

      - name: Export all presets (Linux + Web)
        run: make export-all

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-lord-linux
          path: |
            builds/dungeon_lord.x86_64
            builds/dungeon_lord.pck
          if-no-files-found: error

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web/

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4