name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Pytest
        run: pytest tests/ -v

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: .NET Build
        run: dotnet build DungeonLord.csproj

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.2.2-stable/Godot_v4.2.2-stable_mono_linux_x86_64.zip
          unzip -q Godot_v4.2.2-stable_mono_linux_x86_64.zip
          sudo cp -r Godot_v4.2.2-stable_mono_linux_x86_64/* /usr/local/bin/
          sudo chmod +x /usr/local/bin/Godot_v4.2.2-stable_mono_linux.x86_64
          sudo ln -s /usr/local/bin/Godot_v4.2.2-stable_mono_linux.x86_64 /usr/local/bin/godot

      - name: Run headless Godot smoke test
        run: godot --headless --path . --quit-after 5
